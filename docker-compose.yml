services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
      - .:/var/project:ro
    env_file:
      - laravel/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost}
      APP_DOMAIN: ${APP_DOMAIN:-}
      PLATFORM_PREFIX: /admin

      LOG_CHANNEL: stderr

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel

      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700

      RUN_MIGRATIONS: "true"
      VITE_WATCH: "1"

      # Session in DB so login persists after server restart
      SESSION_DRIVER: database
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.localhost}
    depends_on:
      - db
      - meilisearch
      - minio

  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./laravel:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
    volumes:
      - pgdata:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ''
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/data

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3
    volumes:
      - ./laravel:/var/www/html
      - .:/var/project:ro
    env_file:
      - laravel/.env
    environment:
      APP_ENV: local
      APP_URL: ${APP_URL:-http://localhost}
      APP_DOMAIN: ${APP_DOMAIN:-}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.localhost}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel

      RUN_MIGRATIONS: "false"
    depends_on:
      - db
      - minio

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    env_file:
      - laravel/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      UPLOADS_BUCKET: ${UPLOADS_BUCKET:-uploads}
      UPLOADS_VISIBILITY: ${UPLOADS_VISIBILITY:-public}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for MinIO to accept connections..."
        until mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" 2>/dev/null; do
          echo "  MinIO not ready, retrying in 3s..."
          sleep 3
        done
        until mc ls myminio >/dev/null 2>&1; do
          echo "  MinIO not ready, retrying in 2s..."
          sleep 2
        done
        mc mb myminio/$${UPLOADS_BUCKET} --ignore-existing
        if [ "$${UPLOADS_VISIBILITY}" = "public" ]; then
          mc anonymous set public myminio/$${UPLOADS_BUCKET}
        fi
        echo "Bucket $${UPLOADS_BUCKET} ready."

volumes:
  pgdata:
  meilisearch_data:
  minio_data: