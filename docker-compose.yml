services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bikes
      POSTGRES_PASSWORD: bikes
      POSTGRES_DB: bikeslist
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://bikes:bikes@db:5432/bikeslist
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3000
      PUBLIC_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      PORT: 3002
      PUBLIC_API_URL: http://api:3001
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  db_data:
