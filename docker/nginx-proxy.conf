events {
    worker_connections 1024;
}

http {
    # Global limit for request bodies (uploads): 10MB
    client_max_body_size 10m;

    # Pass through X-Forwarded-Proto from upstream (e.g. Cloudflare sends "https").
    # Fall back to $scheme for local dev where no upstream proxy exists.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    # SSL settings – certs managed by Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/bikeslist.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikeslist.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    upstream app {
        server app:80 max_fails=3 fail_timeout=30s;
    }

    # HTTP → HTTPS redirect (all domains), but allow ACME challenges through
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Default server (bikeslist.org)
    server {
        listen 443 ssl default_server;
        server_name bikeslist.org;

        location / {
            proxy_pass http://app;
            proxy_set_header Host bikeslist.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Admin subdomain
    server {
        listen 443 ssl;
        server_name admin.bikeslist.org;

        location / {
            proxy_pass http://app;
            proxy_set_header Host admin.bikeslist.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Region subdomains (catch-all)
    server {
        listen 443 ssl;
        server_name *.bikeslist.org;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
