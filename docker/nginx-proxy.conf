events {
    worker_connections 1024;
}

http {
    # Global limit for request bodies (uploads): 10MB
    client_max_body_size 10m;

    # Pass through X-Forwarded-Proto from upstream (e.g. Cloudflare sends "https").
    # Fall back to $scheme for local dev where no upstream proxy exists.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    upstream app {
        server app:80 max_fails=3 fail_timeout=30s;
    }

    # Localhost server (for local development)
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://app;
            proxy_set_header Host bikeslist.org; # Rewrite Host header for Laravel routing
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Default server (bikeslist.org)
    server {
        listen 80 default_server;
        server_name bikeslist.org;

        location / {
            proxy_pass http://app;
            proxy_set_header Host bikeslist.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Admin subdomain (production only - for local dev, use port 8080)
    server {
        listen 80;
        server_name admin.bikeslist.org;

        location / {
            proxy_pass http://app;
            proxy_set_header Host admin.bikeslist.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Region subdomains (catch-all)
    server {
        listen 80;
        server_name *.bikeslist.org;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
