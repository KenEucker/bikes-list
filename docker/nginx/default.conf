server {
    listen 80;
    server_name _;

    # Limit upload size to 10MB so users get a clear
    # error instead of very large requests being accepted.
    client_max_body_size 10m;

    root /var/www/html/public;
    index index.php index.html;

    # Proxy public uploads from MinIO so the bucket is served through the
    # domain instead of exposing MinIO's port directly.
    location /uploads/ {
        proxy_pass http://minio:9000/uploads/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass app:9000;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

