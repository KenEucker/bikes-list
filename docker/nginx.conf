server {
    listen 80;
    server_name _;

    # ACME challenges for Let's Encrypt cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Default server — bikeslist.org
server {
    listen 443 ssl default_server;
    server_name bikeslist.org;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/bikeslist.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikeslist.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

