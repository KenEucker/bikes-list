[www]
; On small droplets the default "dynamic" PM keeps idle workers alive that eat
; 50-80 MB each.  "ondemand" spawns workers only when requests arrive and kills
; them after 10 s of idle time, drastically reducing baseline memory.
;
; Override via env: PHP_FPM_PM / PHP_FPM_MAX_CHILDREN in docker-compose.prod.yml

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500
