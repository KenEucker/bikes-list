services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bikes
      POSTGRES_PASSWORD: bikes
      POSTGRES_DB: bikeslist
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      PORT: 3001
      DATABASE_URL: postgres://bikes:bikes@db:5432/bikeslist
      LOG_LEVEL: info
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends openssl libssl1.1 && rm -rf /var/lib/apt/lists/* && while [ ! -f /app/.deps_installed ]; do sleep 1; done; npm run -w apps/api migrate:deploy && npm run -w apps/api seed && npm run -w apps/api dev"
    ports:
      - "3001:3001"
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_started

  web:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      PORT: 3000
      PUBLIC_API_URL: http://api:3001
    command: sh -c "while [ ! -f /app/.deps_installed ]; do sleep 1; done; npm run -w apps/web dev"
    ports:
      - "3000:3000"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  admin:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      PORT: 3002
      PUBLIC_API_URL: http://api:3001
    command: sh -c "while [ ! -f /app/.deps_installed ]; do sleep 1; done; npm run -w apps/admin dev"
    ports:
      - "3002:3002"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  deps:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends openssl libssl1.1 && rm -rf /var/lib/apt/lists/* && npm install && touch /app/.deps_installed"
    restart: "no"

volumes:
  db_data:
  node_modules:
