services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bikes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bikes}
      POSTGRES_DB: ${POSTGRES_DB:-bikeslist}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgres://bikes:bikes@db:5432/bikeslist}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://api:3001}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-BikesList <no-reply@bikeslist.dev>}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bikeslist-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/bikeslist-media}
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends openssl libssl1.1 && rm -rf /var/lib/apt/lists/* && while [ ! -f /app/.deps_installed ]; do sleep 1; done; npm run -w apps/api migrate:deploy && npm run -w apps/api seed && npm run -w apps/api dev"
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_started
      mailhog:
        condition: service_started
      minio:
        condition: service_started

  web:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      PORT: ${WEB_PORT:-3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:3001}
    command: sh -c "while [ ! -f /app/.deps_installed ]; do sleep 1; done; npm run -w apps/web dev"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  admin:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      PORT: ${ADMIN_PORT:-3002}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:3001}
    command: sh -c "while [ ! -f /app/.deps_installed ]; do sleep 1; done; npm run -w apps/admin dev"
    ports:
      - "${ADMIN_PORT:-3002}:3002"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  deps:
    image: node:20-bullseye-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends openssl libssl1.1 && rm -rf /var/lib/apt/lists/* && npm install && touch /app/.deps_installed"
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:RELEASE.2024-02-29T00-00-00Z
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-02-29T00-00-00Z
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
        /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-bikeslist-media};
        /usr/bin/mc anonymous set download local/${S3_BUCKET:-bikeslist-media};

volumes:
  db_data:
  node_modules:
  minio_data:
